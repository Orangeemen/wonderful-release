name: GitHub Release 镜像申请
description: 申请镜像托管在 GitHub 的项目 Release 资产
title: "[GitHub Release]: "
labels: ["github-release", "pending"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交申请！请完整填写以下信息，帮助我们高效评估。
        📌 提交前请确认：
        - [ ] 已搜索现有 Issues，确认未重复申请
        - [ ] 已阅读 [行为与收录规则](./POLICY.md)
        - [ ] 项目为 Public 仓库且使用开源许可证允许再分发

  - type: checkboxes
    id: compliance-check
    attributes:
      label: 📋 基础性检查
      description: 必须全部满足，否则申请将无法进入技术评估阶段
      options:
        - label: 已搜索现有 Issues，确认未重复申请
        - label: 项目为 Public 仓库且使用开源许可证允许再分发
        - label: Release 页面包含可分发的二进制/安装包资产
        - label: 项目有持续维护记录（非归档/废弃状态）
    validations:
      required: true

  - type: input
    id: repo-url
    attributes:
      label: GitHub 仓库地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true
      
  - type: textarea
    id: project-intro
    attributes:
      label: 项目简介与必要性
      description: 简要说明项目功能与镜像的必要性
    validations:
      required: true


  - type: checkboxes
    id: project-evaluation
    attributes:
      label: 🎯 项目评估（请按照实际情况勾选）
      description: 请勾选符合条件的选项，以便于我们更好地评估
      options:
        - label: 属于「小而美」类型（功能聚焦 / 体积轻量 / 构建透明）
        - label: 非 Electron 应用，或已说明需镜像 Electron 项目的具体理由
        - label: Release 资产不捆绑运行时，或仅需同步不含运行时的文件
        - label: 已明确实际需要的架构/格式子集（避免全量枚举）
        - label: installer 与 portable 版内容差异显著，或已指定仅需其一
    validations:
      required: false

  - type: checkboxes
    id: storage-assessment
    attributes:
      label: 存储与必要性
      options:
        - label: 单个项目预估存储合理（通常 <10GB，或已提供过滤方案）
        - label: 已检查不存在国内官方可用分发源（或现有源体验不佳）
    validations:
      required: true

  - type: dropdown
    id: version-strategy
    attributes:
      label: 版本同步策略
      options:
        - 仅最新稳定版（推荐）
        - 最近 3 个稳定版
        - 最近 5 个稳定版
        - 包含 pre-release（需说明理由）
    validations:
      required: true

  - type: textarea
    id: asset-filter
    attributes:
      label: 过滤规则（强烈建议填写）
      description: |
        为避免存储冗余，请明确实际需要的架构/格式子集。
        留空则代表期望同步所有Release文件。
        例：仅同步 x64/arm64 架构的不包含运行时的.exe和.deb文件
      render: shell
    validations:
      required: false


  - type: input
    id: estimated-size
    attributes:
      label: 预估单版本/总存储占用
      placeholder: 例：~50MB/版本，历史 5 个版本约 250MB
    validations:
      required: true

