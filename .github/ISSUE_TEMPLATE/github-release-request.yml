name: 🐙 GitHub Release 镜像申请
description: 申请镜像托管在 GitHub 的项目 Release 资产
title: "[GitHub Release]: "
labels: ["github-release", "pending"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交申请！请完整填写以下信息，帮助我们高效评估。
        📌 提交前请确认：
        - [ ] 已搜索现有 Issues，确认未重复申请
        - [ ] 已阅读 [行为与收录规则](./POLICY.md)
        - [ ] 项目为 Public 仓库且使用开源许可证允许再分发

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 已搜索现有 Issues，确认未重复申请
          required: true
        - label: 已阅读 [行为与收录规则](./POLICY.md)
          required: true
        - label: 已确认项目为 Public 仓库且使用开源许可证允许再分发
          required: true

  - type: textarea
    id: project-intro
    attributes:
      label: 项目简介与必要性
      description: 简要说明项目功能与镜像的必要性
    validations:
      required: true

  - type: input
    id: repo-url
    attributes:
      label: GitHub 仓库地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: project-category
    attributes:
      label: 项目类型自评
      options:
        - 🪶 小而美（轻量应用，推荐）
        - 🔧 原生桌面应用（比如C#等）
        - 🔗 Release自带运行时的项目（.NET/Java/Python等）
        - ⚡ Electron/Chromium 应用（需额外说明）
        - ❓ 其他/不确定
    validations:
      required: true

  - type: dropdown
    id: version-strategy
    attributes:
      label: 版本同步策略
      options:
        - 仅最新稳定版（推荐）
        - 最近 3 个稳定版
        - 最近 5 个稳定版
        - 包含 pre-release（需说明理由）
    validations:
      required: true

  - type: textarea
    id: asset-filter
    attributes:
      label: 过滤规则（强烈建议填写）
      description: |
        为避免存储冗余，请明确实际需要的架构/格式子集。
        留空则代表期望同步所有Release文件。
        例：仅同步 x64/arm64 架构的.exe和.deb文件
      render: shell
    validations:
      required: false


  - type: input
    id: estimated-size
    attributes:
      label: 预估单版本/总存储占用
      placeholder: 例：~50MB/版本，历史 5 个版本约 250MB
    validations:
      required: true

