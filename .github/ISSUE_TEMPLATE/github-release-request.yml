name: 🐙 GitHub Release 镜像申请
description: 申请镜像托管在 GitHub 的项目 Release 资产
title: "[GitHub Release]: "
labels: ["github-release", "pending"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交申请！请完整填写以下信息，帮助我们高效评估。
        📌 提交前请确认：
        - [ ] 已搜索现有 Issues，确认未重复申请
        - [ ] 已阅读 [行为与收录规则](./POLICY.md)
        - [ ] 项目为 Public 仓库且使用开源许可证

  - type: input
    id: repo-url
    attributes:
      label: GitHub 仓库地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: dropdown
    id: project-category
    attributes:
      label: 项目类型自评
      options:
        - 🪶 小而美（轻量工具/库/CLI，推荐）
        - 🔧 原生桌面应用（非 Electron）
        - 🔗 依赖系统运行时（.NET/Java/Python 等）
        - ⚡ Electron/Chromium 应用（需额外说明）
        - 🌍 大型框架/平台/引擎（需说明场景）
        - ❓ 其他/不确定
    validations:
      required: true

  - type: dropdown
    id: runtime-bundled
    attributes:
      label: Release 资产是否捆绑运行时？
      description: 捆绑运行时会显著增加存储占用。我们优先收录依赖系统预装环境的项目。
      options:
        - ✅ 否，依赖系统预装运行时（推荐）
        - ⚠️ 部分捆绑（仅含特定 native 库）
        - ❌ 是，完全自包含（如内嵌 Chromium/JRE）
        - ❓ 不确定
    validations:
      required: true

  - type: dropdown
    id: version-strategy
    attributes:
      label: 版本同步策略
      options:
        - 仅最新稳定版（默认，推荐）
        - 最近 3 个稳定版
        - 最近 5 个稳定版
        - 全部稳定版（需评估存储）
        - 包含 pre-release（需说明理由）
    validations:
      required: true

  - type: textarea
    id: asset-filter
    attributes:
      label: 资产过滤规则（强烈建议填写）
      description: |
        为避免存储冗余，请明确实际需要的架构/格式子集（支持正则）。
        留空将尝试同步全部资产，可能降低审核优先级。
        示例：
        - .*-x86_64\.deb$
        - ^(?!.*arm).*\.(exe|zip)$
        - .*win.*-portable\.zip$
      render: shell
    validations:
      required: false

  - type: textarea
    id: usage-reason
    attributes:
      label: 使用场景与上游访问痛点
      description: 请说明具体用途、国内下载遇到的问题（慢/中断/墙），及预估受益用户规模。
      placeholder: 例：团队 CI/CD 依赖该工具下载，GitHub 经常 403 或速度低于 50KB/s。预估 50+ 开发者使用。
    validations:
      required: true

  - type: input
    id: estimated-size
    attributes:
      label: 预估单版本/总存储占用
      placeholder: 例：~50MB/版本，历史 20 个版本约 1GB

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 我确认该项目使用开源许可证，允许镜像分发
          required: true
        - label: 我理解同步可能存在数小时延迟，非实时一致
          required: true
        - label: 我愿意配合维护者优化同步策略（如精简架构/版本）
          required: true